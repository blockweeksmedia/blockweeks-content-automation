name: bootstrap-tests
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: bootstrap-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/workflow.test.mjs scripts/channels.test.mjs
