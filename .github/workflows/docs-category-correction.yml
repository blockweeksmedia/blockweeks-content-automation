name: docs-category-correction
on:
  push:
    branches: [main]
    paths: ['scripts/correct-docs-category.mjs']
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    concurrency:
      group: wp-import-${{ github.repository }}-blockweeks
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/correct-docs-category.test.mjs
      - name: Correct only the existing API article category
        env:
          WP_USERNAME_VALUE: ${{ secrets.WP_BLOCKWEEKS_USERNAME }}
          WP_PASSWORD_VALUE: ${{ secrets.WP_BLOCKWEEKS_APP_PASSWORD }}
        run: node scripts/correct-docs-category.mjs > docs-category-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: docs-category-result
          path: docs-category-result.json
          retention-days: 30
