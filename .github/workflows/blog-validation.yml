name: blog-validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: blog-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate trusted base scripts and candidate data
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
        shell: bash
        run: |
          if [ -z "$PR_NUMBER" ]; then
            node --test scripts/workflow.test.mjs scripts/channels.test.mjs
          elif [ -f scripts/validate-pr.mjs ]; then
            git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
            node --test scripts/workflow.test.mjs scripts/channels.test.mjs
            node scripts/validate-pr.mjs "$BASE_SHA" "$HEAD_SHA"
          else
            echo 'Bootstrap configuration: trusted base has no validator. Human review required; no article auto-merge.'
          fi
