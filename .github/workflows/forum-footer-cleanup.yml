name: forum-footer-cleanup
on:
  push:
    branches: [main]
    paths: ['scripts/cleanup-forum-footer.mjs']
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    concurrency:
      group: wp-import-${{ github.repository }}-blockweeks
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/workflow.test.mjs scripts/channels.test.mjs
      - name: Remove exact footer from existing unedited forum draft
        env:
          WP_USERNAME_VALUE: ${{ secrets.WP_BLOCKWEEKS_USERNAME }}
          WP_PASSWORD_VALUE: ${{ secrets.WP_BLOCKWEEKS_APP_PASSWORD }}
        run: node scripts/cleanup-forum-footer.mjs > forum-footer-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: forum-footer-result
          path: forum-footer-result.json
          retention-days: 30
