name: wordpress-draft-smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wordpress-draft-smoke.yml'
      - 'scripts/draft-smoke-wordpress.mjs'
permissions:
  contents: read
concurrency:
  group: wp-import-${{ github.repository }}-blockweeks
  cancel-in-progress: false
jobs:
  four-channel-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Create and verify four labelled drafts
        env:
          WP_BLOCKWEEKS_USERNAME: ${{ secrets.WP_BLOCKWEEKS_USERNAME }}
          WP_BLOCKWEEKS_APP_PASSWORD: ${{ secrets.WP_BLOCKWEEKS_APP_PASSWORD }}
        run: node scripts/draft-smoke-wordpress.mjs
      - name: Save draft test receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blockweeks-draft-smoke-result
          path: blockweeks-draft-smoke-result.json
          if-no-files-found: warn
          retention-days: 30
